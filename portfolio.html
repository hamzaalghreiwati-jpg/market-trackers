const KS = "mtPass";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryDecrypt(pass) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(SALT), iterations:600000, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(IV) }, key, b64(CT));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function unlock() {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const pass = document.getElementById("pw").value;
  if (!pass) return;
  btn.disabled = true; err.textContent = "";
  try {
    const html = await tryDecrypt(pass);
    try {
      sessionStorage.setItem(KS, pass);
      if (document.getElementById("rem").checked) localStorage.setItem(KS, pass);
    } catch (e) {}
    show(html);
  } catch (e) { err.textContent = "Wrong passphrase."; btn.disabled = false; }
}
async function autoUnlock() {
  let saved = null;
  try { saved = sessionStorage.getItem(KS) || localStorage.getItem(KS); } catch (e) {}
  if (!saved) return;
  document.getElementById("form").style.display = "none";
  document.getElementById("busy").style.display = "block";
  try {
    const html = await tryDecrypt(saved);
    try { sessionStorage.setItem(KS, saved); } catch (e) {}
    show(html);
  } catch (e) {
    try { sessionStorage.removeItem(KS); localStorage.removeItem(KS); } catch (x) {}
    document.getElementById("busy").style.display = "none";
    document.getElementById("form").style.display = "block";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
autoUnlock();
</script>
