<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Market Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { background:#0e0f13; color:#e8e6e1; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; -webkit-font-smoothing:antialiased; }
  .box { background:#171921; border:1px solid #262a36; border-radius:16px; padding:38px 36px; width:350px; text-align:center;
         box-shadow: 0 2px 6px rgba(0,0,0,.5), 0 16px 48px rgba(0,0,0,.25); }
  .dot { color:#d4a943; font-size:26px; }
  h1 { font-size:16px; font-weight:600; margin:12px 0 4px; letter-spacing:.2px; }
  p { color:#8b8f9c; font-size:12.5px; margin:0 0 20px; }
  input[type=password] { width:100%; box-sizing:border-box; background:#0e0f13; border:1px solid #262a36; border-radius:9px;
          color:#e8e6e1; padding:12px; font-size:14px; outline:none; font-family:inherit; }
  input[type=password]:focus { border-color:#d4a943; }
  .rem { display:flex; align-items:center; gap:7px; margin-top:12px; color:#8b8f9c; font-size:12px; cursor:pointer; }
  button { width:100%; margin-top:14px; background:#d4a943; color:#0e0f13; border:none; border-radius:9px;
           padding:12px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.6; cursor:wait; }
  #err { color:#e05c5c; font-size:12px; margin-top:10px; min-height:15px; }
  #busy { color:#8b8f9c; font-size:12.5px; }
</style>
</head>

    <button id="go">Unlock</button>

  </div>

const KS = "mtPass";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryDecrypt(pass) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(SALT), iterations:600000, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(IV) }, key, b64(CT));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function unlock() {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  const pass = document.getElementById("pw").value;
  if (!pass) return;
  btn.disabled = true; err.textContent = "";
  try {
    const html = await tryDecrypt(pass);
    try {
      sessionStorage.setItem(KS, pass);
      if (document.getElementById("rem").checked) localStorage.setItem(KS, pass);
    } catch (e) {}
    show(html);
  } catch (e) { err.textContent = "Wrong passphrase."; btn.disabled = false; }
}
async function autoUnlock() {
  let saved = null;
  try { saved = sessionStorage.getItem(KS) || localStorage.getItem(KS); } catch (e) {}
  if (!saved) return;
  document.getElementById("form").style.display = "none";
  document.getElementById("busy").style.display = "block";
  try {
    const html = await tryDecrypt(saved);
    try { sessionStorage.setItem(KS, saved); } catch (e) {}
    show(html);
  } catch (e) {
    try { sessionStorage.removeItem(KS); localStorage.removeItem(KS); } catch (x) {}
    document.getElementById("busy").style.display = "none";
    document.getElementById("form").style.display = "block";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
autoUnlock();
